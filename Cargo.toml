[package]
name = "local-distribution-system"
version = "0.1.0"
edition = "2021"
authors = ["Iulian <julian@lds.ro>"]
description = "Local Distribution System (LDS) - Healthcare, Pharmacy & Veterinary Guidance in Romania with Google Maps"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
parking_lot = "0.12"

